  - block-scale
  - wgmma
  - cluster
  - mbarrier
  - ldmatrix
  - stmatrix
  # Ordinary asynchronous global->shared copy (cp.async / LDGSTS), distinct from
  # the TMA bulk-copy engine (tma). Available on Ampere sm_87.
  - cp-async
  # Warp-level matrix-multiply-accumulate (HMMA / wmma.mma), distinct from the
  # Hopper warpgroup wgmma and the Blackwell tcgen05 paths.
  - mma

