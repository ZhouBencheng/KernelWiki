## Thor (SM110) source / evidence registry.
##
## Separates four distinct axes for each Thor feature so that source confidence
## is never mistaken for execution:
##   - targets:         the compiler-target family built for (sm_110/sm_110a/sm_110f),
##                      kept separate from the device architecture identity.
##   - evidence_status: the strongest *substantiated* rung on the ladder
##                      pending < compiled < executed < profiled.
##   - source_ids:      the corpus pages that support the claim.
##   - artifacts / ncu_records: hash-bearing receipt DECLARATIONS. A runtime rung
##                      (executed/profiled) must DECLARE artifacts with 64-hex
##                      sha256 strings; a bare name or hashless entry is rejected
##                      structurally (the bytes themselves are not read here).
##
## Validated by scripts/validate.py::validate_thor_evidence_registry, a STRUCTURAL
## / declared-consistency gate: it rejects a record that DECLARES compile-only
## evidence under a runtime/profiled status, missing source IDs, a declared
## device/tool identity inconsistent with the declared probe inventory, an
## unsupported/invented feature, and a pending record without a concrete
## missing_check (or one that declares runtime/profiling/artifact receipts). It
## does NOT read artifact bytes; the actual bytes, feature, target and stage are
## established by root's strict receipt checker against an explicit evidence root
## (task11), not by this CPU-only check.
##
## Receipts are immutable observations recorded by the root orchestrator in the
## parent campaign (probe-build-02/, validation-check/, validation-profile/).
## Those files are read-only; the digests below are copied from their manifests
## and from the exported NCU reports, never edited here. A tcgen05.fence target
## gate is compile-only and cannot substantiate MMA / TMEM / NVFP4 execution.

