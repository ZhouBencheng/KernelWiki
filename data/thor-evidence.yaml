## external bytes separately; scripts/validate.py does not check these receipts.

probe_inventory:
  device:
    name: "NVIDIA Thor"
    cc: "11.0"
    driver: "595.78"
  tool:
    nvcc: "13.2.86"
    ncu: "2026.1.1"
    cuda: "13.2"
  source_tree: "../ (parent campaign of workspace/)"

## Staged, author-prepared self-checking probe sources + exact commands +
## expected outputs for the root to run on Thor. The sources are byte-identical
## to the validated campaign harness (sha256 under each feature's artifacts).
probe_manifest: probes/probe-manifest.yaml

features:
  # Baseline: native target compilation + on-device check (exact equality) for
  # the supplied three-target build sm_110 / sm_110a / sm_110f.
  - id: thor-native-target
    feature: native-target
    targets: [sm_110, sm_110a, sm_110f]
    evidence_status: executed
    source_ids: [doc-nvidia-thor-targets, pr-flashinfer-1608]
    device:
      cc: "11.0"
    tool:
      nvcc: "13.2.86"
    runtime_check: >-
      Each compiled target binary passed `--mode check` with exact equality on
      NVIDIA Thor (compute capability 11.0); __CUDA_ARCH__=1100 for every target
      and __CUDA_ARCH_SPECIFIC__=1100 only for the sm_110a build. See
      validation-check/manifest.json (status: passed).
    artifacts:
      - kind: source
        name: harness/thor_probe.cu
        sha256: 9791954036202eae55567dd248b66336ff3466e8416019d4aaf7cddfbd86ebcd
      - kind: binary
        name: probe-build-02/thor-probe-sm_110-lineinfo
        sha256: 4556302f04ad6f618e470a7ee871f708cf4effdf21e7d759f8f66bb0201dd2e2
      - kind: binary
        name: probe-build-02/thor-probe-sm_110a-lineinfo
        sha256: 4c6eea45c61076c134d6321260422c8aa24cad2160c448b8fa3b4af876c0541b
      - kind: binary
        name: probe-build-02/thor-probe-sm_110f-lineinfo
        sha256: ab7393f5528d07fb44f832faaae601b6f488947463a1415bffdc1ef9c1bb97fe

  # TMA: genuine cp.async.bulk.tensor.1d tensor-map copy+reduce. Correctness
  # checked (exact FP32 equality vs the SIMT reference) and profiled with NCU.
  - id: thor-tma-bulk-1d
    feature: tma
    targets: [sm_110]
    evidence_status: profiled
    source_ids: [doc-nvidia-thor-targets, pr-flashinfer-1608]
    device:
      cc: "11.0"
    tool:
      nvcc: "13.2.86"
      ncu: "2026.1.1"
    runtime_check: >-
      Kernel thor_tma_copy_reduce (cp.async.bulk.tensor.1d tensor-map TMA)
      produced exact FP32 equality against the thor_simt_copy_reduce reference
      under `--mode check` on NVIDIA Thor (validation-check/manifest.json,
      status: passed). Scope: 1-D bulk tensor copy + reduction only.
    artifacts:
      - kind: source
        name: harness/thor_probe.cu
        sha256: 9791954036202eae55567dd248b66336ff3466e8416019d4aaf7cddfbd86ebcd
      - kind: binary
        name: probe-build-02/thor-probe-sm_110-lineinfo
        sha256: 4556302f04ad6f618e470a7ee871f708cf4effdf21e7d759f8f66bb0201dd2e2
    ncu_records:
      - report: validation-profile/probe-lineinfo.ncu-rep
        sha256: 4e013885c997fc30752e72795f12570339d16c456ea7087e25982a1a07c08953
        sections: [PmSampling, PmSampling_WarpStates]
        kernels: [thor_simt_copy_reduce, thor_tma_copy_reduce]

  # tcgen05 target gating (tcgen05.fence) is compile-only: the assembler accepts
  # the sm_110a target gate, but no MMA was issued or executed. This receipt
  # substantiates compile acceptance ONLY — never MMA/TMEM/NVFP4 execution.
  - id: thor-tcgen05-fence-gate
    feature: tcgen05
    targets: [sm_110a]
    evidence_status: compiled
    source_ids: [doc-nvidia-thor-targets]
    artifacts:
      - kind: source
        name: harness/tcgen05_target_gate.cu
        sha256: 5e3d7ed86309cef8f4561e651ac6585c5e14ab027bf56dbcfac29f6de8abd1f4

  # The feature matrix below stays narrow: documented, execution pending. Each
  # carries a concrete missing check and no runtime/profiling receipts (AC-2.1).
  - id: thor-tcgen05-mma
    feature: tcgen05
    targets: [sm_110a]
    evidence_status: pending
    source_ids: [doc-nvidia-thor-targets]
    missing_check: >-
      tcgen05.mma issue + result correctness on Thor not yet run; only the
      tcgen05.fence target gate compiles (see thor-tcgen05-fence-gate). No MMA
      execution evidence.

  - id: thor-tmem
    feature: tmem
    targets: [sm_110a]
    evidence_status: pending
    source_ids: [doc-nvidia-thor-targets]
    missing_check: >-
      TMEM allocation / residency and tcgen05 TMEM operands not exercised on
      Thor. No execution evidence.

  - id: thor-nvfp4
    feature: nvfp4
    targets: [sm_110a]
    evidence_status: pending
    source_ids: [doc-nvidia-thor-targets, pr-sglang-18787]
    missing_check: >-
      NVFP4 (E2M1) correctness not validated on Thor; the sglang capability gate
      expansion is not an NVFP4 correctness test.

  - id: thor-clc
    feature: clc
    targets: [sm_110a]
    evidence_status: pending
    source_ids: [doc-nvidia-thor-targets]
    missing_check: >-
      Cluster Launch Control execution on Thor not run. No evidence.

  - id: thor-2sm-cooperative
    feature: 2sm-cooperative
    targets: [sm_110a]
    evidence_status: pending
    source_ids: [doc-nvidia-thor-targets]
    missing_check: >-
      Two-CTA (cta_group::2) cooperative execution on Thor not run. No evidence.
